<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lty5418导航站</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext x='32' y='43' text-anchor='middle' font-size='34' font-family='sans-serif' font-weight='600' fill='%23aab6d8'%3EL%3C/text%3E%3C/svg%3E">
<script>
  // 渲染前确定主题，避免闪一下
  (function(){
    var t;
    try{ t = localStorage.getItem('lty-theme'); }catch(e){}
    if(t !== 'light' && t !== 'dark'){
      t = (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
    }
    document.documentElement.dataset.theme = t;
  })();
</script>
<style>
  /* 深色：不用纯黑，走偏暖的石墨灰，卡片用实色拉开层次 */
  :root{
    --bg:#14171d;
    --glow:rgba(158,172,200,.055);
    --surface:#1c2028;
    --surface-hover:#232833;
    --border:rgba(255,255,255,.075);
    --border-hover:rgba(255,255,255,.19);
    --text:#f7f8fa;
    --muted:#9aa2af;
    --p1:#242a35; --p2:#1b202a; --p3:#181d26;
    --shadow:0 20px 48px rgba(0,0,0,.34);
    --veil:linear-gradient(to bottom,rgba(12,15,20,.09),rgba(12,15,20,.17));
    --frame-filter:brightness(.90) saturate(.96);
  }

  [data-theme="light"]{
    --bg:#f5f6f8;
    --glow:rgba(90,110,170,.07);
    --surface:rgba(255,255,255,.82);
    --surface-hover:#ffffff;
    --border:rgba(20,24,32,.10);
    --border-hover:rgba(20,24,32,.24);
    --text:#171a20;
    --muted:#69717e;
    --p1:#e8ecf6; --p2:#dfe4ef; --p3:#eef1f7;
    --shadow:0 18px 44px rgba(30,40,70,.12);
    --veil:linear-gradient(to bottom,transparent 65%,rgba(0,0,0,.06));
    --frame-filter:none;
  }

  *{
    box-sizing:border-box;margin:0;padding:0;
    -webkit-tap-highlight-color:transparent;
  }
  html{-webkit-text-size-adjust:100%}
  ::selection{background:rgba(140,150,170,.30);color:var(--text)}

  body{
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    justify-content:center;
    padding:clamp(56px,13vh,132px) 24px 72px;
    position:relative;
    overflow-x:hidden;
    transition:background-color .45s ease,color .45s ease;
  }

  body::before{
    content:"";
    position:fixed;
    top:-360px;left:50%;
    width:940px;height:720px;
    transform:translateX(-50%);
    background:radial-gradient(ellipse at center,var(--glow),transparent 72%);
    pointer-events:none;
    transition:background .45s ease;
  }

  .wrap{width:100%;max-width:920px;position:relative}

  h1{
    font-size:clamp(32px,6vw,52px);
    font-weight:600;
    letter-spacing:-.03em;
    line-height:1.15;
    margin-bottom:clamp(40px,7vh,68px);
    animation:rise .7s cubic-bezier(.22,1,.36,1) both;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(280px,340px));
    gap:16px;
  }

  .card{
    display:block;
    border:1px solid var(--border);
    border-radius:20px;
    background:var(--surface);
    text-decoration:none;
    color:inherit;
    overflow:hidden;
    -webkit-user-select:none;user-select:none;
    -webkit-touch-callout:none;
    transition:transform .35s cubic-bezier(.22,1,.36,1),
               background .45s ease,
               border-color .45s ease,
               box-shadow .35s ease,
               opacity .2s ease;
    animation:rise .7s cubic-bezier(.22,1,.36,1) both;
  }
  .card:nth-child(1){animation-delay:.10s}
  .card:nth-child(2){animation-delay:.16s}
  .card:nth-child(3){animation-delay:.22s}
  .card:nth-child(4){animation-delay:.28s}
  .card:nth-child(5){animation-delay:.34s}
  .card:nth-child(6){animation-delay:.40s}

  .card:hover,.card:focus-visible{
    transform:translateY(-5px);
    background:var(--surface-hover);
    border-color:var(--border-hover);
    box-shadow:var(--shadow);
    outline:none;
  }

  /* 自定按压反馈：轻微下沉 + 收亮度，替代系统那块蓝色闪光 */
  .card:active{
    transform:translateY(-1px) scale(.988);
    background:var(--surface-hover);
    border-color:var(--border-hover);
    opacity:.84;
    box-shadow:none;
    transition-duration:.08s;
  }

  /* 实时预览：目标页按 2 倍视口渲染后缩小为缩略图 */
  .preview{
    position:relative;
    height:210px;
    overflow:hidden;
    background:linear-gradient(145deg,var(--p1),var(--p2) 60%,var(--p3));
    border-bottom:1px solid var(--border);
    transition:background .45s ease;
  }

  .preview iframe{
    position:absolute;
    top:0;left:0;
    width:200%;
    height:200%;
    border:0;
    transform:scale(.5);
    transform-origin:top left;
    pointer-events:none;
    background:#fff;
    filter:var(--frame-filter);
    transition:filter .5s ease;
  }

  /* 白底页面在深色里压一点亮度，不再是一块刺眼的白 */
  .preview::after{
    content:"";
    position:absolute;
    inset:0;
    background:var(--veil);
    pointer-events:none;
    transition:background .45s ease;
  }

  .preview--fallback iframe{display:none}

  /* GitHub 主页不允许被嵌入，改用实时头像 */
  .preview--profile{
    display:grid;
    place-items:center;
  }
  .preview--profile::after{display:none}

  .avatar{
    width:78px;height:78px;
    border-radius:50%;
    object-fit:cover;
    background:var(--surface-hover);
    box-shadow:0 12px 30px rgba(0,0,0,.20);
    transition:transform .45s cubic-bezier(.22,1,.36,1);
  }
  .card:hover .avatar{transform:scale(1.07)}

  .handle{
    display:none;
    font:20px ui-monospace,SFMono-Regular,Menlo,monospace;
    color:var(--text);
  }
  .preview--profile.no-img .handle{display:block}

  .card-body{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding:22px 24px;
  }

  .card-title{font-size:17px;font-weight:550;letter-spacing:.01em}

  .arrow{
    font-size:17px;
    color:var(--muted);
    transition:transform .35s cubic-bezier(.22,1,.36,1),color .35s ease;
  }
  .card:hover .arrow,.card:focus-visible .arrow{
    transform:translateX(5px);
    color:var(--text);
  }

  /* 主题切换按钮 */
  .theme-toggle{
    position:fixed;
    top:20px;right:20px;
    z-index:10001;
    width:38px;height:38px;
    display:grid;
    place-items:center;
    border:1px solid var(--border);
    border-radius:50%;
    background:var(--surface);
    color:var(--muted);
    cursor:pointer;
    transition:color .35s ease,border-color .35s ease,
               transform .5s cubic-bezier(.22,1,.36,1),background .45s ease;
  }
  .theme-toggle:hover{
    color:var(--text);
    border-color:var(--border-hover);
    transform:rotate(-20deg);
  }
  .theme-toggle:active{transform:scale(.9)}
  .theme-toggle:hover:active{transform:rotate(-20deg) scale(.9)}
  .theme-toggle:focus-visible{outline:2px solid var(--border-hover);outline-offset:3px}

  /* 图标是转场交接，不是硬切 */
  .theme-toggle svg{
    position:absolute;
    inset:0;margin:auto;
    width:18px;height:18px;
    transition:opacity .42s ease,transform .62s cubic-bezier(.22,1,.36,1);
  }
  [data-theme="dark"] .icon-moon{opacity:1;transform:rotate(0) scale(1)}
  [data-theme="dark"] .icon-sun{opacity:0;transform:rotate(-90deg) scale(.45)}
  [data-theme="light"] .icon-sun{opacity:1;transform:rotate(0) scale(1)}
  [data-theme="light"] .icon-moon{opacity:0;transform:rotate(90deg) scale(.45)}
  /* 切换不是硬切：新主题底色从按下处一圈铺开。
     用真实图层而非浏览器截图，图标交接不会被冻结成两张重叠的静态图 */
  /* 用一颗真实的圆 div 做 scale 放大，不靠 clip-path 插值：
     部分移动端浏览器不给 circle() 做动画插值，圆就会停在半路扩不满屏 */
  .theme-veil{
    position:fixed;
    inset:0;
    z-index:10000;
    overflow:hidden;
    pointer-events:none;
  }
  .theme-orb{
    position:absolute;
    border-radius:50%;
    transform:scale(0);
    transform-origin:center center;
    will-change:transform;
  }
  /* 与两套 --bg 一致；写死，避免继承到切换前的旧底色 */
  .theme-orb[data-theme="dark"]{background:#14171d}
  .theme-orb[data-theme="light"]{background:#f5f6f8}

  /* 换主题只发生在遮罩完全盖住屏幕时，且这一下要瞬时完成：
     否则遮罩淡出后页面还会自己渐变一次色，看着像整屏慢慢变色。
     图标 svg 保留过渡，月亮/太阳的旋转交接照常播放 */
  html.no-trans *:not(svg),
  html.no-trans body::before,
  html.no-trans .preview::after{transition:none!important}

  @keyframes rise{
    from{opacity:0;transform:translateY(16px)}
    to{opacity:1;transform:translateY(0)}
  }

  @media (max-width:600px){
    body{padding-top:64px}
    .theme-toggle{top:16px;right:16px}
    .grid{grid-template-columns:1fr}
    .preview{height:190px}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

  <script>
  (function(){
    var root = document.documentElement;
    var btn  = document.getElementById('theme-toggle');
    var DELAYS = [500, 1100, 2200];   // 失败后 0.5s → 1.1s → 2.2s 退避重试

    /* ---------- 主题：圆形揭示切换 ---------- */
    function syncLabel(){
      var light = root.dataset.theme === 'light';
      btn.setAttribute('aria-label', light ? '切换到深色模式' : '切换到浅色模式');
      btn.title = btn.getAttribute('aria-label');
    }

    var busy = false;

    function setTheme(next, origin){
      if(root.dataset.theme === next || busy) return;

      var commit = function(){
        root.dataset.theme = next;
        try{ localStorage.setItem('lty-theme', next); }catch(e){}
        syncLabel();
      };

      var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
      if(reduce || !Element.prototype.animate){ commit(); return; }

      busy = true;
      var r = btn.getBoundingClientRect();
      // 键盘触发时 clientX/Y 会是 0，退回按钮中心
      var x = (origin && origin.x > 0) ? origin.x : r.left + r.width / 2;
      var y = (origin && origin.y > 0) ? origin.y : r.top + r.height / 2;
      var vw = window.innerWidth, vh = window.innerHeight;
      // 到最远角距离 x1.08 作余量，保证四个角一定被盖住
      var radius = Math.hypot(Math.max(x, vw - x), Math.max(y, vh - y)) * 1.08;
      var size = radius * 2;

      var veil = document.createElement('div');
      veil.className = 'theme-veil';
      var orb = document.createElement('div');
      orb.className = 'theme-orb';
      orb.dataset.theme = next;
      orb.style.width  = size + 'px';
      orb.style.height = size + 'px';
      orb.style.left   = (x - size / 2) + 'px';
      orb.style.top    = (y - size / 2) + 'px';
      veil.appendChild(orb);
      document.body.appendChild(veil);

      var committed = false;
      var doCommit = function(){
        if(committed) return;
        committed = true;
        // 换色只在圆完全盖满屏时发生，且瞬时完成；淡出后不会再渐变一次色
        root.classList.add('no-trans');
        commit();
        void document.body.offsetHeight;
        requestAnimationFrame(function(){
          requestAnimationFrame(function(){ root.classList.remove('no-trans'); });
        });
      };

      var done = false;
      var finish = function(){
        if(done) return;
        done = true;
        doCommit();                       // 动画异常也要保证主题真的换了
        root.classList.remove('no-trans');
        veil.remove();
        busy = false;
      };

      try{
        // 按钮独立转一圈，点下去立刻有反馈
        btn.animate(
          [{transform:'rotate(0deg)'}, {transform:'rotate(360deg)'}],
          {duration:560, easing:'cubic-bezier(.22,1,.36,1)'}
        );

        // scale 是合成器属性，任何浏览器都能一路放到 scale(1)，圆一定扩满屏
        var reveal = orb.animate(
          [{transform:'scale(0)'}, {transform:'scale(1)'}],
          {duration:560, easing:'cubic-bezier(.22,1,.36,1)', fill:'forwards'}
        );

        // 页面切后台时动画可能被暂停，超时强制收尾
        setTimeout(finish, 1200);

        reveal.finished.then(function(){
          doCommit();
          return veil.animate(
            [{opacity:1}, {opacity:0}],
            {duration:260, easing:'ease', fill:'forwards'}
          ).finished;
        }).then(finish).catch(finish);
      }catch(err){
        finish();                         // 兜底：不支持动画就静默直接切
      }
    }

    btn.addEventListener('click', function(e){
      setTheme(root.dataset.theme === 'light' ? 'dark' : 'light', {x:e.clientX, y:e.clientY});
    });

    // 没手动选过就跟随系统，且走同一套切换
    if(window.matchMedia){
      var mq = matchMedia('(prefers-color-scheme: light)');
      var onSystem = function(e){
        var saved; try{ saved = localStorage.getItem('lty-theme'); }catch(err){}
        if(saved === 'light' || saved === 'dark') return;
        setTheme(e.matches ? 'light' : 'dark');
      };
      if(mq.addEventListener) mq.addEventListener('change', onSystem);
      else if(mq.addListener) mq.addListener(onSystem);
    }
    syncLabel();

    /* ---------- 加载重试：404 / 超时不会一上来就回退 ---------- */
    function bust(url, n){
      return url + (url.indexOf('?') >= 0 ? '&' : '?') + '_r=' + n;
    }

    function retryImage(img, base, onFail){
      var n = 0;
      img.addEventListener('error', function(){
        if(n < DELAYS.length){
          var d = DELAYS[n]; n++;
          setTimeout(function(){ img.src = bust(base, n); }, d);
        }else{
          onFail();
        }
      });
      img.src = base;
    }

    function retryFrame(frame, base, onFail){
      var n = 0, done = false, waiting = false, timer = null;

      function attempt(src){
        clearTimeout(timer);
        waiting = false;
        frame.src = src;
        // 跨域拿不到状态码，用「没在 6s 内 load」当失败信号
        timer = setTimeout(function(){ if(!done) fail(); }, 6000);
      }
      function fail(){
        // 超时与 error 事件可能同时来，锁住避免重复排重试
        if(done || waiting) return;
        clearTimeout(timer);
        if(n < DELAYS.length){
          var d = DELAYS[n]; n++;
          waiting = true;
          setTimeout(function(){ attempt(bust(base, n)); }, d);
        }else{
          onFail();
        }
      }
      frame.addEventListener('load', function(){ done = true; clearTimeout(timer); });
      frame.addEventListener('error', fail);
      attempt(base);
    }

    var avatar  = document.getElementById('gh-avatar');
    var ghBox   = document.getElementById('gh-preview');
    retryImage(avatar, avatar.dataset.src, function(){
      avatar.style.display = 'none';
      ghBox.classList.add('no-img');
    });

    // 所有预览都走重试；错峰启动，避免几个游戏页同时开跑抢资源
    var frames = document.querySelectorAll('.preview iframe');
    Array.prototype.forEach.call(frames, function(frame, i){
      setTimeout(function(){
        retryFrame(frame, frame.dataset.src, function(){
          frame.parentNode.classList.add('preview--fallback');
        });
      }, i * 280);
    });
  })();
  </script>

</body>
</html>
